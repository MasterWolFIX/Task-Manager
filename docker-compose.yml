services:
  postgres:
    image: postgres:16-alpine
    container_name: projekt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projekt
      POSTGRES_USER: projekt_user
      POSTGRES_PASSWORD: projekt_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: projekt_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
